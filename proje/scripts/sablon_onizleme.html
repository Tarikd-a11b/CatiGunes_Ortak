<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çatı GES Veri Önizleme</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --mut:#5c6670; --osb:#e8590c; --kamu:#1971c2; --sinir:#f8f9fa; }
  html,body { margin:0; height:100%; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--fg); background:var(--bg); }
  #harita { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; top:12px; left:56px; max-width:330px; background:var(--bg);
           padding:12px 14px; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .panel h1 { font-size:15px; margin:0 0 4px; } .panel p { margin:4px 0; color:var(--mut); font-size:12.5px; }
  .lej { display:flex; align-items:center; gap:6px; font-size:13px; margin-top:4px; }
  .lej i { width:14px; height:14px; border-radius:3px; display:inline-block; }
  .leaflet-popup-content table { border-collapse:collapse; font-size:12px; }
  .leaflet-popup-content td { padding:1px 6px 1px 0; vertical-align:top; } .leaflet-popup-content td:first-child { color:var(--mut); }
  @media (max-width:600px){ .panel{ left:12px; right:12px; top:auto; bottom:24px; max-width:none; } }
</style>
</head>
<body>
<div id="harita"></div>
<div class="panel">
  <h1>Çatı GES — veri önizleme</h1>
  <p>Atatürk OSB binaları + Çiğli devlet okul ve hastaneleri (OSM, {{TARIH}}). Bir binaya tıkla → tüm özellikleri.</p>
  <div class="lej"><i style="background:var(--osb)"></i>OSB binası (OSM)</div>
  <div class="lej"><i style="background:var(--kamu)"></i>Devlet okulu / hastanesi (OSM)</div>
  <div class="lej"><i style="border:2px solid #fff;background:transparent"></i>Çiğli / OSB sınırı</div>
  <p>Tüm katmanlar (MS, 3D-GloBFP, Çiğli binaları) için <b>catigunes_veri.gpkg</b> → QGIS.</p>
</div>
<script>
const VERI = /*VERI*/null;
const uydu = L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 20, maxNativeZoom: 19, attribution: 'Görüntü © Esri, Maxar' });
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom: 19, attribution: '© OpenStreetMap katkıcıları' });
const harita = L.map('harita', { layers: [uydu] });
const tablo = p => '<table>' + Object.entries(p).filter(([k, v]) => v !== null && v !== '')
  .map(([k, v]) => `<tr><td>${k}</td><td>${String(v).replace(/</g, '&lt;')}</td></tr>`).join('') + '</table>';
const sinir = L.geoJSON(VERI.sinir, { style: { color: '#fff', weight: 2, fill: false, dashArray: '6 4' },
  onEachFeature: (f, l) => l.bindPopup(tablo(f.properties)) }).addTo(harita);
const osb = L.geoJSON(VERI.osb, { style: { color: '#e8590c', weight: 1, fillOpacity: .35 },
  onEachFeature: (f, l) => l.bindPopup(tablo(f.properties)) }).addTo(harita);
const kamu = L.geoJSON(VERI.kamu, {
  style: { color: '#1971c2', weight: 1.5, fillOpacity: .35 },
  pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 6, color: '#fff', weight: 1.5, fillColor: '#1971c2', fillOpacity: 1 }),
  onEachFeature: (f, l) => l.bindPopup(tablo(f.properties)) }).addTo(harita);
L.control.layers({ 'Uydu (Esri)': uydu, 'OpenStreetMap': osm },
  { 'Sınırlar': sinir, 'OSB binaları': osb, 'Okul + hastane': kamu }, { position: 'topright' }).addTo(harita);
L.control.scale({ imperial: false }).addTo(harita);
harita.fitBounds(sinir.getBounds());
</script>
</body>
</html>
